name: Checks

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.88.0"
            python: "3.10"
          - rust: stable
            python: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Prepare Rust toolchain
        env:
          OKMS_RUST_TOOLCHAIN: ${{ matrix.rust }}
        run: rustup toolchain install "$OKMS_RUST_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Build and check Rust
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
        run: |
          cargo build --locked
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
      - name: Check Rust formatting
        if: matrix.rust == 'stable'
        run: cargo +stable fmt --all -- --check
      - name: Prepare maintainer environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check documents and regressions
        run: |
          .venv/bin/python scripts/check_docs.py
          .venv/bin/python -m unittest discover -s tests -v
          sh -n install.sh
