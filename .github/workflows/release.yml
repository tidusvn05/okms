name: Hybrid Team release

"on":
  push:
    tags: ["hybrid-team-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hybrid-release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.package.outputs.tag }}
      version: ${{ steps.package.outputs.version }}
      archive: ${{ steps.package.outputs.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate pushed tag
        if: github.event_name == 'push'
        run: python scripts/build_hybrid_release.py --tag "$GITHUB_REF_NAME" --validate-only
      - name: Prepare maintainer environment
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Check documents and tests
        run: |
          .venv/bin/python scripts/check_docs.py
          .venv/bin/python -m unittest discover -s tests -v
          sh -n install.sh
      - name: Build assets and versioned notes
        id: package
        run: |
          release_args=()
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            release_args+=(--tag "$GITHUB_REF_NAME")
          fi
          .venv/bin/python scripts/build_hybrid_release.py "${release_args[@]}" --output dist --notes dist/release-notes.md > "$RUNNER_TEMP/hybrid-release.json"
          .venv/bin/python - "$RUNNER_TEMP/hybrid-release.json" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          metadata = json.load(open(sys.argv[1]))
          with open(sys.argv[2], "a") as output:
              for key in ("tag", "version", "archive"):
                  output.write(key + "=" + metadata[key] + "\n")
          PY
      - name: Verify checksums and rehearse installation
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          release_project="$(mktemp -d)"
          trap 'rm -rf "$release_project"' EXIT
          sh dist/install.sh --release-dir "$PWD/dist" --project "$release_project" --dry-run
          sh dist/install.sh --release-dir "$PWD/dist" --project "$release_project"
          sh dist/install.sh --release-dir "$PWD/dist" --project "$release_project"
          python "$release_project/.okms/team.py" --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hybrid-team-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      OKMS_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      OKMS_RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      OKMS_RELEASE_ARCHIVE: ${{ needs.prepare.outputs.archive }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: hybrid-team-${{ github.sha }}
          path: dist
      - name: Publish checked prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$OKMS_RELEASE_TAG" \
            "dist/$OKMS_RELEASE_ARCHIVE" dist/install.sh dist/SHA256SUMS \
            --verify-tag --prerelease --latest=false \
            --title "Hybrid Team $OKMS_RELEASE_VERSION (experimental)" \
            --notes-file dist/release-notes.md
      - name: Verify public downloads and installation
        env:
          OKMS_RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          release_downloads="$(mktemp -d)"
          release_project="$(mktemp -d)"
          trap 'rm -rf "$release_downloads" "$release_project"' EXIT
          for release_asset in "$OKMS_RELEASE_ARCHIVE" install.sh SHA256SUMS; do
            curl --fail --location --silent --show-error --proto '=https' --proto-redir '=https' \
              --retry 2 --connect-timeout 15 --max-time 180 \
              "https://github.com/$OKMS_RELEASE_REPOSITORY/releases/download/$OKMS_RELEASE_TAG/$release_asset" \
              --output "$release_downloads/$release_asset"
            cmp "dist/$release_asset" "$release_downloads/$release_asset"
          done
          (cd "$release_downloads" && sha256sum --check SHA256SUMS)
          sh "$release_downloads/install.sh" --version "$OKMS_RELEASE_VERSION" --project "$release_project" --dry-run
          sh "$release_downloads/install.sh" --version "$OKMS_RELEASE_VERSION" --project "$release_project"
          sh "$release_downloads/install.sh" --version "$OKMS_RELEASE_VERSION" --project "$release_project"
          python3 "$release_project/.okms/team.py" --help
